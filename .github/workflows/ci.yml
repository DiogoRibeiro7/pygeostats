name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # The default branch is develop. The previous workflow only ran on pull
    # requests targeting main, which does not exist, so no pull request had
    # ever been checked.
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: black
        run: black --check --diff src/python/ tests/

      - name: ruff
        run: ruff check src/python/ tests/

      # Advisory, not a gate. mypy reports 138 findings in first-party code;
      # clearing them is an annotation project tracked separately. The step
      # still runs so the number stays visible and cannot quietly grow.
      - name: mypy (advisory)
        continue-on-error: true
        run: mypy src/python/pygeostats/

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux covers the full supported range; the other platforms check
          # the floor and the ceiling. One abi3 wheel serves every version, so
          # this matrix is about runtime behaviour, not build coverage.
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.13" }
          # setup-python has no 3.9 build for arm64 macOS runners.
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      # No system BLAS or LAPACK step. ndarray and nalgebra are used in their
      # pure-Rust configurations, so the openblas/lapack installs the previous
      # workflow performed were never needed.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
        # maturin is the build backend, so pip builds the Rust extension here.
        # The previous workflow called `maturin develop`, which requires an
        # active virtualenv and fails on a bare setup-python interpreter.

      - name: Run tests
        run: pytest tests/ -v --cov=pygeostats --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features

  # The previous workflow had a benchmark job invoking
  # benchmarks/benchmark_variogram.py and benchmarks/compare_with_gstat.py.
  # Neither file has ever existed in this repository. Benchmarks also pull in
  # dependencies that are not declared (psutil, tqdm, annoy), so wiring them
  # into CI is its own piece of work rather than something to restore blindly.

  ci-ok:
    name: CI
    # Single required-check target, so branch protection does not need updating
    # every time the matrix changes.
    needs: [lint, test, rust-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "lint:       ${{ needs.lint.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "rust-tests: ${{ needs.rust-tests.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.rust-tests.result }}" = "success" ]
