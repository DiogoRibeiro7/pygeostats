name: Release

# Publishing uses PyPI Trusted Publishing (OpenID Connect). There is no API
# token anywhere in this workflow and no PYPI_API_TOKEN secret is needed:
# GitHub mints a short-lived OIDC token for the publish job, and PyPI exchanges
# it for an equally short-lived upload token after checking that the claims
# match the publisher configured on the project.
#
# The PyPI side must be configured once, under
# https://pypi.org/manage/project/pygeostats/settings/publishing/ (or, before
# the first release, as a "pending publisher" at
# https://pypi.org/manage/account/publishing/), with exactly:
#
#   PyPI project name : pygeostats
#   Owner             : DiogoRibeiro7
#   Repository name   : pygeostats
#   Workflow name     : release.yml
#   Environment name  : pypi
#
# The environment name is not optional here: this workflow sets
# `environment: pypi` on the publish job, and PyPI checks that claim.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Also publish the built artifacts to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishing is irreversible: a release can be yanked but never replaced.
  # The suite runs again here rather than trusting that CI ran on the commit
  # the tag points at.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pytest tests/ -q

  wheels:
    name: "Wheel: ${{ matrix.target }} on ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One wheel per platform, not per platform per Python version. The
        # crate builds against the stable ABI (abi3-py39), so a single
        # cp39-abi3 wheel covers Python 3.9 through 3.14 and later. This
        # replaces the previous 3-OS x 4-version matrix of twelve builds, and
        # means a new Python release needs no rebuild at all.
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # Intel macOS is cross-compiled on the arm64 runner. The macos-13
          # Intel runner this used was retired in December 2025, and GitHub's
          # remaining Intel images are in maintenance mode, so depending on them
          # risks another release that waits forever for a runner.
          # deployment_target is rustc's minimum for each architecture, and
          # wheel_tag is how that version appears in the wheel's platform tag.
          - { runner: macos-latest, target: x86_64, macos_arch: x86_64, deployment_target: "10.12", wheel_tag: "10_12" }
          - { runner: macos-latest, target: aarch64, macos_arch: arm64, deployment_target: "11.0", wheel_tag: "11_0" }
          - { runner: windows-latest, target: x64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # Pinned so a runner image cannot raise it. macos-15-intel started
          # requiring 14.0 in March 2026 (actions/runner-images#13817), which
          # would narrow the wheel to newer Macs without failing the build.
          # maturin uses the larger of this and rustc's default. Empty, and
          # unused, on Linux and Windows.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Verify macOS wheel architecture and platform tag
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.macos_arch }}
          WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: |
          # A cross-compiled wheel cannot be imported on this runner, so check
          # what can be checked: the platform tag, and the architecture of the
          # compiled library inside the wheel.
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"-macosx_${WHEEL_TAG}_${ARCH}.whl") ;;
            *) echo "::error::$wheel is not tagged macosx_${WHEEL_TAG}_${ARCH}"; exit 1 ;;
          esac
          scratch=$(mktemp -d)
          unzip -q "$wheel" -d "$scratch"
          lib=$(find "$scratch" -name '_core*.so' -print -quit)
          archs=$(lipo -archs "$lib")
          echo "$(basename "$wheel"): _core is $archs"
          if [ "$archs" != "$ARCH" ]; then
            echo "::error::expected $ARCH, got $archs"
            exit 1
          fi

      - name: Check wheel metadata
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique per job: upload-artifact fails on an
          # existing name unless `overwrite` is set. The original workflow
          # uploaded every job to the name "wheels", which v4 onwards rejects.
          name: dist-wheel-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Check sdist metadata
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pygeostats
    permissions:
      id-token: write # required to mint the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygeostats
    permissions:
      id-token: write # required to mint the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List what is about to be published
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
