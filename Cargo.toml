[package]
name = "pyspatialstats"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyspatialstats"
crate-type = ["cdylib"]
path = "src/rust/src/lib.rs"

[features]
default = ["parallel"]
simd = []
parallel = []
sparse = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.7"
nalgebra = "0.32"
approx = "0.5"

[profile.release]
lto = true
codegen-units = 1
