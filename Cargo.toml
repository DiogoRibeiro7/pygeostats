[package]
name = "pyspatialstats"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyspatialstats"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
ndarray = "0.15"
rayon = "1.7"
nalgebra = "0.32"
approx = "0.5"

[dependencies.blas-src]
version = "0.10"
features = ["openblas"]

[dependencies.lapack-src]
version = "0.10"
features = ["openblas"]

[profile.release]
lto = true
codegen-units = 1
