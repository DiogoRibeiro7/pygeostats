[package]
name = "pygeostats"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Rust core for the pygeostats Python package: variogram estimation and fitting, kriging, and distance kernels"
license = "MIT"
repository = "https://github.com/DiogoRibeiro7/pygeostats"
readme = "README.md"

[lib]
name = "pygeostats"
crate-type = ["cdylib"]
path = "src/rust/src/lib.rs"

[features]
# extension-module tells the linker not to link libpython, which is correct for
# the cdylib but leaves a `cargo test` binary full of undefined Python symbols
# on Linux and macOS. Keeping it behind a default-on feature lets tests build
# with `--no-default-features --features parallel`, which links libpython.
# Windows links libpython either way, which is why this only shows up in CI.
default = ["extension-module", "parallel"]
extension-module = ["pyo3/extension-module"]
simd = []
parallel = []
sparse = []

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.7"
nalgebra = "0.32"
approx = "0.5"

[lints.clippy]
# Variogram and kriging kernels legitimately take many scalar parameters
# (nugget, sill, range_major, range_minor, angle, bins, ...) and hand back
# tuples of several arrays across the FFI boundary. Splitting them up to
# satisfy these two lints would obscure the mathematics without making the
# code any safer, so they are allowed deliberately rather than case by case.
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = true
codegen-units = 1
