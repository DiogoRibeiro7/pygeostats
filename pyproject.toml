[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pygeostats"
version = "0.1.0"
description = "Geostatistics for Python with a Rust-accelerated core: variograms, kriging, point patterns and spatial autocorrelation"
authors = [
    {name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["spatial", "statistics", "geostatistics", "kriging", "variogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "geopandas>=0.10.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/pygeostats"
Issues = "https://github.com/DiogoRibeiro7/pygeostats/issues"

# cupy is deliberately not declared as an extra: the correct distribution
# depends on the installed CUDA version (cupy-cuda12x, cupy-cuda11x, ...) and
# has to be chosen by the user. acceleration/gpu.py degrades without it.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "sphinx",
    "nbsphinx",
    "jupyter",
]
approx = ["annoy>=1.17"]       # ApproximateNeighborIndex backend
progress = ["tqdm>=4.60"]      # progress bars in the parallel executors
plotting = ["plotly>=5.0"]     # interactive plots alongside matplotlib
test = [
    "pytest>=7.0",
    "pytest-benchmark",
    "pytest-cov",
    "hypothesis",
]

[tool.maturin]
python-source = "src/python"
module-name = "pygeostats._core"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which vary between
# releases -- an unpinned set makes CI fail on a ruff upgrade rather than on a
# code change. E/F/W are the pycodestyle and pyflakes core; B (bugbear) catches
# real defects such as warnings.warn without stacklevel and raise-without-from.
# The pyupgrade (UP) and future-annotations (FA) families are deliberately left
# out: they rewrite typing.List -> list and Optional[X] -> X | None, which this
# package cannot adopt while it targets Python 3.9 at runtime.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line length is black's responsibility
]

[tool.ruff.lint.per-file-ignores]
# The package __init__ files re-export their public surface behind
# try/except ModuleNotFoundError guards so the pure-Python half stays usable
# when the compiled _core extension is absent. __all__ is assembled at runtime
# inside those guards, so ruff cannot see the names as re-exports.
"src/python/pygeostats/__init__.py" = ["F401"]
"src/python/pygeostats/*/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
# warn_return_any is off deliberately. scipy, sklearn, geopandas and the rest
# ship no type information, so nearly every numerical expression is typed Any
# and this flag alone produced 85 of 223 findings -- noise from the dependency
# graph, not defects here. Worth turning back on once those returns are
# annotated. mypy currently reports 138 findings and runs as an advisory step
# in CI rather than a gate; see .github/workflows/ci.yml.

[[tool.mypy.overrides]]
# Scientific dependencies that ship no type information. Without these mypy
# reports an import error per usage and stops before it reaches any real
# type checking.
module = [
    "annoy.*",
    "bokeh.*",
    "cupy.*",
    "geopandas.*",
    "matplotlib.*",
    "psutil.*",
    "scipy.*",
    "plotly.*",
    "sklearn.*",
    "tqdm.*",
    # numpy.testing and pandas.testing pull in pytest, whose source uses match
    # statements. With python_version pinned at 3.9 mypy rejects that syntax,
    # so a library type-check would fail on the test framework's own code.
    "_pytest.*",
]
ignore_missing_imports = true
# Do not analyse third-party sources. ignore_missing_imports only covers
# modules mypy cannot find; for an installed but untyped package mypy would
# otherwise parse its source, and report that package's own errors as ours.
follow_imports = "skip"

[[tool.mypy.overrides]]
# _core is the compiled Rust extension, so there is no source for mypy to read.
# A generated _core.pyi stub would be better and is worth doing separately.
module = ["pygeostats._core"]
ignore_missing_imports = true